name: CI

on:
  push:
    branches: [main]
    paths:
      - 'figureforge/**'
      - 'scripts/**'
      - 'skills/**'
      - 'assets/**'
      - '.github/workflows/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths:
      - 'figureforge/**'
      - 'scripts/**'
      - 'skills/**'
      - 'assets/**'
      - '.github/workflows/**'
      - '*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check all editor JS
        run: |
          for f in figureforge/js/*.js; do
            node --check "$f"
          done
      - name: Template & palette integrity
        run: node scripts/check-templates.js
      - name: Skill metadata, evals schema, markdown links
        run: node scripts/check-repo.js
      - name: Dump template SVGs
        run: node scripts/dump-templates.js
      - name: SVG well-formedness (assets + templates)
        run: python3 scripts/check-svg.py .tmp/template-svg assets skills/nature-figure/evals/visual-baseline

  visual-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install plotting stack
        run: pip install --quiet matplotlib numpy
      - name: api.md blocks execute + baseline invariants hold
        run: python3 skills/nature-figure/evals/visual-baseline/render.py --check
